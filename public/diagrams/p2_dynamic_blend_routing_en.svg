<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Geist,'Inter',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1a1"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#171717"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>

  <text x="60" y="58" font-size="30" font-weight="600" letter-spacing="-1.1" fill="#171717">Dynamic multi-expert alpha blending and routing</text>
  <text x="60" y="88" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" letter-spacing="0.6" fill="#767676">LINEAR IC ANCHOR · XGBOOST RESIDUAL · GRU TEMPORAL · CAUSAL ROUTER</text>
  <rect x="60" y="106" width="1080" height="2" fill="#171717"/>

  <rect x="100" y="150" width="300" height="120" rx="8" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="122" y="190" font-size="17" font-weight="600" fill="#171717">Linear IC (anchor)</text>
  <text x="122" y="216" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Historical CS RankIC / ICIR</text>
  <text x="122" y="238" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Weight floor ≥ 60%</text>

  <rect x="460" y="150" width="300" height="120" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="482" y="190" font-size="17" font-weight="600" fill="#171717">XGBoost (residual)</text>
  <text x="482" y="216" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Learns the PIT Linear residual rank</text>
  <text x="482" y="238" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Weight cap ≤ 20%</text>

  <rect x="820" y="150" width="300" height="120" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="842" y="190" font-size="17" font-weight="600" fill="#171717">GRU (temporal)</text>
  <text x="842" y="216" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">40-day price / volume sequence</text>
  <text x="842" y="238" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Cap ≤ 25% (nonlinear ≤ 40%)</text>

  <rect x="100" y="340" width="1020" height="130" rx="8" fill="#171717"/>
  <text x="122" y="382" font-size="17" font-weight="600" fill="#ffffff">Causal router (dynamic · bounded · smoothed)</text>
  <text x="122" y="410" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#a1a1a1">IN  lagged OOF RankIC · top-bottom return · signal covariance · turnover cost · prior weights</text>
  <text x="122" y="434" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#a1a1a1">OUT each expert's weight this period, bounded; pushed towards zero when evidence is weak</text>

  <rect x="100" y="530" width="300" height="120" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="122" y="570" font-size="17" font-weight="600" fill="#171717">Blended alpha</text>
  <text x="122" y="596" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Weighted blend + CS standardisation</text>
  <text x="122" y="618" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Coverage and autocorrelation checks</text>

  <rect x="460" y="530" width="300" height="120" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="482" y="570" font-size="17" font-weight="600" fill="#171717">Risk and optimisation</text>
  <text x="482" y="596" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Barra-style risk model + hard TE cap</text>
  <text x="482" y="618" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Clarabel / Gurobi</text>

  <rect x="820" y="530" width="300" height="120" rx="8" fill="#ffffff" stroke="#ebebeb" stroke-width="1.5"/>
  <text x="842" y="570" font-size="17" font-weight="600" fill="#171717">Portfolio output</text>
  <text x="842" y="596" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">Target weights · active weights</text>
  <text x="842" y="618" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#767676">TE calibration and diagnostics</text>

  <path d="M250 270 V334" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M610 270 V334" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M970 270 V334" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M250 470 V524" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M610 470 V524" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M970 470 V524" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M400 590 H454" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M760 590 H814" stroke="#a1a1a1" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M94 210 H58 V405 H94" stroke="#171717" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ad)"/>
  <text x="40" y="330" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11" letter-spacing="0.5" fill="#171717" transform="rotate(-90 40 330)">OOF HISTORY / EXPERT SCORES</text>
</svg>
