name: Deploy to GitHub Pages

# 构建前先用 actions/configure-pages 读出本站的真实地址与子路径，写进 SITE /
# BASE_PATH 交给 astro.config.mjs。因此无论是用户站（<user>.github.io）还是项目站
# （<user>.github.io/<repo>），都不需要改代码或改配置。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Pages address
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 让工作流自行开启 Pages（等价于 Settings → Pages → Source 选 GitHub Actions），
          # 仓库首次部署时不需要手动设置。
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
